# Sprite and autotile cases for scripts/bench/pixel_compare.py.
# Needs klein-pixel-art and pixel-tools pulled on the server.
- id: knight
  kind: sprite
  prompt: pixel art sprite, a knight in plate armor, full body, facing front, plain background
  model: klein-pixel-art
  size: 512x512
  pixelize:
  - palette: db32
  - palette: auto:16
  - palette: db32
    target_size: 64x64
