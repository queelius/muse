# 4x4 walk-sheet cases for scripts/bench/pixel_compare.py.
# Needs klein-pixel-walk (on flux2-klein-base-4b) and pixel-tools pulled.
# The card's 4x4 template sentence is prepended by the model's prompt_prefix.
# grid=4 is the card's 4x downscale (128x128 sheet, 32x32 frames); the second
# variant lets grid=auto find it (it did, 4/4, in the 2026-10-28 spike).
- id: walk-knight
  kind: sprite
  prompt: A pixel art spritesheet of a medieval knight wearing steel plate armor and a helmet with a blue plume.
  model: klein-pixel-walk
  size: 512x512
  seed: 7
  pixelize:
  - {sheet: 4x4, grid: 4, palette: "auto:24"}
  - {sheet: 4x4, palette: "auto:24"}
- id: walk-witch
